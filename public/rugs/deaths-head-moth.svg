    <!-- Wings Left & Right -->
    <path d="M450 340 C310 170 105 180 95 335 C85 455 230 510 355 495 C235 545 155 645 225 725 C295 795 405 695 450 585 C495 695 605 795 675 725 C745 645 665 545 545 495 C670 510 815 455 805 335 C795 180 590 170 450 340 Z" fill="#111111" stroke="#111111" stroke-width="28" stroke-linejoin="round"/>
