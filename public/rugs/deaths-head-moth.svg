    <path d="M430 365 C315 215 140 215 130 335 C122 425 255 470 385 465 Z" fill="#E9A820" stroke="#111111" stroke-width="16"/>
    <path d="M470 365 C585 215 760 215 770 335 C778 425 645 470 515 465 Z" fill="#E9A820" stroke="#111111" stroke-width="16"/>
    <!-- Lower Wings Fill -->
    <path d="M415 495 C280 535 195 630 245 698 C295 752 385 665 432 560 Z" fill="#D62828" stroke="#111111" stroke-width="16"/>
    <path d="M485 495 C620 535 705 630 655 698 C605 752 515 665 468 560 Z" fill="#D62828" stroke="#111111" stroke-width="16"/>
    <!-- Wing Eye Spots -->
    <circle cx="245" cy="345" r="42" fill="#2EC4B6" stroke="#111111" stroke-width="14"/>
    <circle cx="655" cy="345" r="42" fill="#2EC4B6" stroke="#111111" stroke-width="14"/>
    <circle cx="245" cy="345" r="14" fill="#F5EBC8"/>
    <circle cx="655" cy="345" r="14" fill="#F5EBC8"/>
