    <ellipse cx="450" cy="465" rx="68" ry="135" fill="#111111"/>
    <circle cx="450" cy="405" r="46" fill="#F5EBC8" stroke="#111111" stroke-width="12"/>
    <circle cx="433" cy="400" r="10" fill="#111111"/>
    <circle cx="467" cy="400" r="10" fill="#111111"/>
    <!-- Striped Abdomen -->
    <rect x="412" y="490" width="76" height="22" rx="10" fill="#E9A820"/>
    <rect x="418" y="530" width="64" height="20" rx="10" fill="#E9A820"/>
    <rect x="426" y="568" width="48" height="18" rx="9" fill="#E9A820"/>
