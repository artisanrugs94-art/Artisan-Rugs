      <stop offset="0%" stop-color="#D7CFC4"/>
      <stop offset="100%" stop-color="#BFB4A6"/>
    </linearGradient>
    <filter id="tuft2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#wood2)"/>
