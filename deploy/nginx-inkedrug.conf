# Nginx Reverse Proxy Configuration for Kazumi Rugs (inkedrug.com)
# Place at: /etc/nginx/sites-available/inkedrug.com
# Enable with: sudo ln -sf /etc/nginx/sites-available/inkedrug.com /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# Issue free SSL with: sudo certbot --nginx -d inkedrug.com -d www.inkedrug.com

server {
    listen 80;
    listen [::]:80;
    server_name inkedrug.com www.inkedrug.com;

    # Allow reference image & CSV/ZIP uploads up to 25MB
    client_max_body_size 25M;

    # Gzip compression for fast US & India page loads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve Cloudflare country header if domain uses Cloudflare DNS
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_cache_bypass $http_upgrade;
    }
}
